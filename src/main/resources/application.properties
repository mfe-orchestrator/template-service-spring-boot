spring.application.name=%serviceSlug%

# HTTP
server.port=${PORT:8080}
# On SIGTERM: readiness turns REFUSING_TRAFFIC, new requests are refused, in-flight ones get up to the phase timeout
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# Actuator: only health and info over HTTP, never env/heapdump/beans
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# OpenAPI: public, served in every profile
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
